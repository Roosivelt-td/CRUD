{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto bg-white rounded-2xl shadow-sm border border-slate-100 p-8 space-y-6">
    <div class="text-center space-y-2">
        <h2 class="text-2xl font-bold text-slate-900">Iniciar Sesión</h2>
        <p class="text-sm text-slate-500">Ingresa a tu cuenta para realizar compras y ver tu historial.</p>
    </div>

    {% if error %}
    <div class="bg-rose-50 border border-rose-200 text-rose-700 px-4 py-3 rounded-xl text-sm">
        {{ error }}
    </div>
    {% endif %}

    <form action="/login" method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
            <input type="email" name="email" required placeholder="tu@correo.com" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
            <input type="password" name="password" required placeholder="••••••••" class="w-full px-3 py-2 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-sm">
            Entrar
        </button>
    </form>

    <div class="text-center text-sm text-slate-500 pt-4 border-t">
        ¿No tienes una cuenta? <a href="/register" class="text-indigo-600 font-semibold hover:underline">Regístrate aquí</a>
    </div>
</div>
{% endblock %}
