<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online - Compra y Venta</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">
    <!-- Header -->
    <header class="bg-indigo-600 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <a href="/" class="text-white text-2xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
                </svg>
                Tienda Online
            </a>

            <!-- User Auth & Role Nav -->
            <div class="flex items-center gap-3">
                {% if user %}
                    <div class="bg-indigo-700/60 px-4 py-2 rounded-xl text-white text-sm font-medium flex items-center gap-2 border border-indigo-500/40">
                        <span>👤 {{ user.username }}</span>
                        {% if user.role == 'admin' %}
                            <span class="bg-rose-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">Admin</span>
                        {% else %}
                            <span class="bg-emerald-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">Cliente</span>
                        {% endif %}
                    </div>
                    <a href="/logout" class="bg-indigo-700 hover:bg-indigo-800 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                        Cerrar Sesión
                    </a>
                {% else %}
                    <a href="/login" class="bg-indigo-700 hover:bg-indigo-800 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-sm">
                        Iniciar Sesión
                    </a>
                    <a href="/register" class="bg-white text-indigo-700 hover:bg-indigo-50 px-4 py-2 rounded-xl text-sm font-bold transition shadow-sm">
                        Registrarse
                    </a>
                {% endif %}
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-sm text-slate-500">
        <p>Sistema de Compra y Venta con FastAPI, PostgreSQL, Tailwind y Chart.js</p>
    </footer>
</body>
</html>
